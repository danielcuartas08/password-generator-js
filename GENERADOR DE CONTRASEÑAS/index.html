<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Contraseñas</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <h1>🔐 Generador de Contraseñas</h1>

        <div class="settings">
            <label for="length">Longitud:</label>
            <input type="number" id="length" min="4" max="32" value="12" />

            <label><input type="checkbox" id="includeUppercase" checked /> Mayúsculas</label>
            <label><input type="checkbox" id="includeNumbers" checked /> Números</label>
            <label><input type="checkbox" id="includeSymbols" /> Símbolos</label>
            <label><input type="checkbox" id="excludeSimilar" /> Excluir caracteres similares</label>

            <label for="count">Cantidad de contraseñas:</label>
            <input type="number" id="count" min="1" max="100" value="5" />
        </div>

        <button onclick="generatePassword()">Generar</button>
        <input type="text" id="password" readonly />
        <button onclick="copyPassword()">Copiar</button>

        <div class="download-buttons">
            <button onclick="downloadAsTxt()">Descargar .txt</button>
            <button onclick="downloadAsJson()">Descargar .json</button>
        </div>

        <div id="strengthBar">
            <div id="strengthLevel"></div>
        </div>
        <textarea id="passwordsArea" rows="8" readonly></textarea>
    </div>

    <script src="script.js"></script>
</body>

</html>
